<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endler Sprint — Reporte enviado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="panel thanks">
      <div class="panel__head">
        <span>Reporte</span>
        <span class="tag" id="ticketNumber">#00000</span>
      </div>
      <h1 class="title title--small">¡Enviado!</h1>
      <p class="lead">Recibimos tu reporte <strong id="successNumber">#00000</strong>. Te responderemos a tu correo pronto.</p>
      <a href="index.html" class="ghost">Enviar otro reporte</a>
    </section>
    <p class="footnote">Endler Sprint © 2026</p>
  </main>
  <script>
    const pedido = new URLSearchParams(location.search).get("pedido") || "00000";
    document.getElementById("ticketNumber").textContent = "#" + pedido;
    document.getElementById("successNumber").textContent = "#" + pedido;
  </script>
</body>
</html>
